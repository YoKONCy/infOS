map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml font/ttf font/otf application/wasm application/octet-stream;
    gzip_min_length 1024;
    etag on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 附件上传独立放宽到 100MB 原件及 multipart 开销，其余接口沿用原限制。
    location = /api/attachments {
        client_max_body_size 101m;
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/backups/ {
        client_max_body_size 20g;
        client_body_timeout 120s;
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 插件页面的 JS/CSS 也走后端，避免被下方静态文件正则截获。
    location ^~ /api/ {
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /applications/ {
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location ^~ /html-previews/ {
        proxy_pass http://backend:9120;
        proxy_set_header Host $http_host;
    }

    # Vite 内容哈希资源随内容改名，字体、模块和解码器同样可以长期复用。
    location ~* "^/assets/[^/]+-[a-z0-9_-]{8,}\.(js|mjs|css|ttf|otf|woff2?|wasm|png|jpg|jpeg|gif|ico|svg|webp|avif)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 无内容哈希的文件在刷新时协商校验，避免升级后继续使用旧清单或旧图片。
    location ~* \.(js|mjs|css|json|ttf|otf|woff2?|wasm|bcmap|pfb|icc|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

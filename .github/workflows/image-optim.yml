name: Compress Images
on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    # 如果是由 dependabot 或者自己触发的压缩，不再重复执行防止无限循环
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          # 在 PR 中自动添加一段评论，告诉你压缩了多少体积
          ignorePaths: 'node_modules/**'

      - name: Commit compressed images
        # Fork 的 GITHUB_TOKEN 无权推送贡献者分支；仍执行压缩检查，只禁止自动写回。
        if: steps.calibre.outputs.markdown != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.head_ref }}
          commit_message: 'chore: ✨ Compress Images'
          file_pattern: '*.jpg *.jpeg *.png *.webp'

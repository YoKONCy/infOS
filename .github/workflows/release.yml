# 发布流水线 — infOS
# 触发: 推送任意 tag
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ── 1. 质量门禁 (复用 CI) ──
  ci:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── 2. Electron 标准版 (NSIS 安装包) ──
  build-standard:
    name: Build Standard (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('electron/package.json', 'electron-builder.base.yml', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: 检查 Electron 实际内嵌运行时安全基线
        run: pnpm security:electron

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 标准版 (NSIS)
        run: node scripts/build-electron-release.cjs standard
        env:
          INFOS_EDITION: standard

      # 验证: 确认标准版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: pwsh
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $steamFiles = Get-ChildItem $UNPACKED -Recurse -Include "steam_api64.dll","steamworksjs.*.node","steam_appid.txt" -ErrorAction SilentlyContinue
          if ($steamFiles.Count -gt 0) {
            Write-Error "Steam components found in standard build. Build rejected."
            $steamFiles | ForEach-Object { Write-Error "  -> $($_.FullName)" }
            exit 1
          }
          Write-Host "Standard build Steam component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-standard
          path: release-electron/*.exe

  # ── 3. Electron 便携版 (ZIP 解压即用) ──
  build-portable:
    name: Build Portable (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('electron/package.json', 'electron-builder.base.yml', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: 检查 Electron 实际内嵌运行时安全基线
        run: pnpm security:electron

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 便携版
        run: node scripts/build-electron-release.cjs portable
        env:
          INFOS_EDITION: portable

      # 验证: 确认便携版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: pwsh
        run: |
          $portableZip = Get-ChildItem "release-electron" -Filter "*Portable*.zip" | Select-Object -First 1
          if ($portableZip) {
            Write-Host "Portable artifact found: $($portableZip.Name)"
          } else {
            Write-Error "Portable artifact not found"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: electron-portable
          path: release-electron/*Portable*.zip

  # Standard 安装包只做构建期产物检查；NSIS GUI 安装在无桌面 CI 中可能永久等待，
  # 不再将无人值守安装烟测作为发布门禁。
  accept-portable:
    name: Accept Portable Archive
    runs-on: windows-2022
    needs: build-portable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/validate-release-artifact.mjs
            /scripts/i18n.mjs
            /packages/shared/src/i18n/locales/zh-CN/scripts/validate-release-artifact.json
            /packages/shared/src/i18n/locales/zh-TW/scripts/validate-release-artifact.json
            /packages/shared/src/i18n/locales/en-US/scripts/validate-release-artifact.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: acceptance-artifacts/portable

      - name: 解压并启动最终 Portable ZIP
        run: node scripts/validate-release-artifact.mjs portable acceptance-artifacts/portable acceptance-evidence/portable

      - name: 上传 Portable 验收现场
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-portable-evidence
          path: acceptance-evidence/portable
          if-no-files-found: warn

  # ── 5. Electron Steam 版 ──
  build-steam:
    name: Build Steam (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('electron/package.json', 'electron-builder.base.yml', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: 检查 Electron 实际内嵌运行时安全基线
        run: pnpm security:electron

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron Steam 版
        run: node scripts/build-electron-release.cjs steam
        env:
          INFOS_EDITION: steam

      # 验证: 确认 Steam 版包含必要的 Steam 组件
      - name: 验证 Steam 组件已包含
        shell: pwsh
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $dll = Test-Path "$UNPACKED/steam_api64.dll"
          $appid = Test-Path "$UNPACKED/steam_appid.txt"
          if (!$dll -or !$appid) {
            Write-Error "Steam build is missing required components (steam_api64.dll / steam_appid.txt)"
            exit 1
          }
          Write-Host "Steam build component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-steam
          path: release-electron/win-unpacked/**/*

  # ── 6. Docker 镜像构建 ──
  build-docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: 提取镜像元数据
        id: meta
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "发布版本不能作为 Docker 标签使用" >&2
            exit 1
          fi
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME,,}"
          if [[ "$TAG" != *-rc* && "$TAG" != *-alpha* && "$TAG" != *-beta* ]]; then
            echo "backend_latest=${REGISTRY}/${OWNER}/infos-backend:latest" >> "$GITHUB_OUTPUT"
            echo "frontend_latest=${REGISTRY}/${OWNER}/infos-frontend:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_latest }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并发布前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_latest }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. GitHub Release ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-standard, accept-portable, build-steam, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: electron-standard
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: release-assets/

      - name: 生成 Docker Compose 一键部署包
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || ! "$OWNER" =~ ^[a-z0-9-]+$ ]]; then
            echo "发布镜像名称或版本无效" >&2
            exit 1
          fi
          sed -e "s/__INFOS_VERSION__/${VERSION}/g" -e "s/__INFOS_OWNER__/${OWNER}/g" docker-compose.release.yml > release-assets/docker-compose.yml

      # Steam 版不上传到 GitHub Release（通过 SteamPipe 发布）

      - name: 生成中文发布说明
        run: node scripts/generate-release-notes.mjs "${{ github.ref_name }}" release-notes.md

      - name: 生成发布元数据
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME,,}"
          echo "build_time=$(date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc* || "$TAG" == *-alpha* || "$TAG" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: '萌动链接：PeroperoChat！ ${{ github.ref_name }}'
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.prerelease != 'true' }}
          files: release-assets/*
          overwrite_files: true
          body_path: release-notes.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# CI 流水线 — infOS-TS
# 触发规则: push 到 main/dev 或 PR 到 main
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # 允许其他 workflow (如 release.yml) 复用本流水线
  workflow_call:

# 同一 PR 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Runtime & Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 核对安全基线与开发发行版本一致性
        run: pnpm security:runtime
      - name: 审计全部依赖的高危与严重漏洞
        run: pnpm security:audit
      - name: 保存原始审计与本地回补证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-evidence
          path: TEMP/security-audit/
          if-no-files-found: ignore

  # ── 阶段 1: 代码规范检查（仅提示，不阻断测试、构建与发布）──
  lint:
    name: Lint & Format (Non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Prettier
        run: pnpm format:check
        continue-on-error: true

  # ── 阶段 2: 单元测试 ──
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            maxWorkers: 4
          - os: windows-2022
            maxWorkers: 2
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test:run --maxWorkers=${{ matrix.maxWorkers }}

  # ── 阶段 3: 类型检查 + 构建验证 ──
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 全包类型与模板检查
        run: pnpm typecheck

      - name: 测试代码类型检查
        run: pnpm exec tsc --noEmit

      - name: 版本号同步
        run: pnpm version:sync --check

      - name: 全包构建
        run: pnpm build

      - name: Daemon 发行依赖边界检查
        run: node scripts/build-daemon-bundle.mjs

  # ── 阶段 4: Docker 配置与镜像验证 ──
  docker-smoke:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 生成隔离容器的烟测凭据
        run: |
          node -e 'const fs = require("node:fs"); const { randomBytes } = require("node:crypto"); const token = randomBytes(32).toString("hex"); console.log("::add-mask::" + token); fs.appendFileSync(process.env.GITHUB_ENV, "INFOS_API_TOKEN=" + token + "\n");'

      - name: 验证 Compose 配置
        run: pnpm docker:validate

      - name: 构建完整镜像
        run: docker compose build

      - name: 启动并等待健康检查
        run: docker compose up -d --wait --wait-timeout 180

      - name: 验证代理入口
        run: |
          curl --fail http://localhost:3000/healthz
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/applications/arca/
          curl --fail http://localhost:3000/applications/pictoria/

      - name: 验证子应用启动、传输与停止
        run: pnpm docker:smoke http://localhost:3000

      - name: 输出容器日志
        if: failure()
        run: docker compose logs --no-color

      - name: 清理测试容器
        if: always()
        run: docker compose down --volumes
